parameters:
- name: 'arch'
  type: string
- name: 'pool'
  type: object
  default: {}
- name: 'containerImage'
  type: string
- name: 'codeCoverage'
  type: boolean
  default: false

jobs:
- job:
  displayName: ${{ parameters.arch }}
  timeoutInMinutes: 60
  pool: ${{ parameters.pool }}

  container:
    image: ${{ parameters.containerImage }}

  steps:
  - ${{ if and(eq(parameters.arch, 'amd64'), parameters.codeCoverage) }}:
    - script: |
        wget https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
        sudo dpkg -i packages-microsoft-prod.deb
        rm packages-microsoft-prod.deb
        sudo apt-get update
        sudo apt-get install -y apt-transport-https
        sudo apt-get install -y dotnet-sdk-8.0
      displayName: install .Net
  - script: |
      set -ex
      sudo apt-get update
      sudo apt-get install -y \
          libboost-system1.83-dev \
          libboost-thread1.83-dev \
          libboost-serialization1.83-dev \
          googletest \
          libgtest-dev \
          libgmock-dev \
          libhiredis-dev \
          libnl-3-dev \
          libnl-route-3-dev \
          libnl-genl-3-dev \
          libnl-nf-3-dev \
          redis-server \
          stgit \
          cmake \
          libpcap-dev
      sudo sed -ri 's/^# unixsocket/unixsocket/' /etc/redis/redis.conf
      sudo sed -ri 's/^unixsocketperm .../unixsocketperm 777/' /etc/redis/redis.conf
      sudo sed -ri 's/redis-server.sock/redis.sock/' /etc/redis/redis.conf
      sudo service redis-server start

    displayName: "Install dependencies"
  - checkout: self
    clean: true
    submodules: recursive
  - script: |
      git submodule foreach --recursive 'git clean -xfdf || true'
      git submodule foreach --recursive 'git reset --hard || true'
      git submodule foreach --recursive 'git remote update || true'
      git submodule update --init --recursive
    displayName: 'Reset submodules'
  - task: DownloadPipelineArtifact@2
    inputs:
      source: specific
      project: build
      pipeline: Azure.sonic-buildimage.common_libs
      runVersion: 'latestFromBranch'
      runBranch: 'refs/heads/master'
      path: $(Build.ArtifactStagingDirectory)/download
      ${{ if eq(parameters.arch, 'amd64') }}:
        artifact: common-lib
      ${{ else }}:
        artifact: common-lib.${{ parameters.arch }}
      patterns: |
        target/debs/bookworm/libyang3_*.deb
        target/debs/bookworm/libyang-dev_3*.deb
    displayName: "Download libyang from common lib"
  - script: |
      set -ex
      sudo dpkg -i $(find ./download -name *.deb)
    workingDirectory: $(Build.ArtifactStagingDirectory)
    displayName: "Install libyang from common lib"
  - task: DownloadPipelineArtifact@2
    inputs:
      source: specific
      project: build
      pipeline: 9
      ${{ if eq(parameters.arch, 'amd64') }}:
        artifact: sonic-swss-common-bookworm
      ${{ else }}:
        artifact: sonic-swss-common-bookworm.${{ parameters.arch }}
      runVersion: 'latestFromBranch'
      runBranch: 'refs/heads/master'
      path: '$(Build.SourcesDirectory)/sonic-swss-common'
    displayName: "Download sonic swss common deb packages"
  - script: |
        sudo dpkg -i sonic-swss-common/libswsscommon_1.0.0_${{ parameters.arch }}.deb
        sudo dpkg -i sonic-swss-common/libswsscommon-dev_1.0.0_${{ parameters.arch }}.deb
    displayName: "Install sonic swss common"
  - script: |
      rm ../*.deb || true
      dpkg-buildpackage -us -uc -b -j$(nproc)
      cp ../*.deb $(Build.ArtifactStagingDirectory)
    workingDirectory: dhcp6relay
    displayName: "Compile sonic dhcp6relay"
  - ${{ if eq(parameters.arch, 'amd64') }}:
    - script: |
        set -euo pipefail
        saved=$(mktemp -d)
        cp src/relay.cpp src/relay.h "$saved/"
        cp build-test/dhcp6relay-test "$saved/"
        trap 'cp "$saved/relay.cpp" src/relay.cpp; cp "$saved/relay.h" src/relay.h; cp "$saved/dhcp6relay-test" build-test/dhcp6relay-test; rm -rf "$saved"' EXIT
        sha256sum test/mock_address_selection.cpp
        git fetch --no-tags --depth=1 https://github.com/sonic-net/sonic-dhcp-relay.git 633c8e1736854fca52553255a9abb9d0f704ce0e
        git show 633c8e1736854fca52553255a9abb9d0f704ce0e:dhcp6relay/src/relay.cpp > src/relay.cpp
        git show 633c8e1736854fca52553255a9abb9d0f704ce0e:dhcp6relay/src/relay.h > src/relay.h
        make -j2 build-test/dhcp6relay-test
        set +e
        sudo ASAN_OPTIONS=detect_leaks=0 ./build-test/dhcp6relay-test --gtest_filter='address_order/VlanAddressSelection.primary_identity/*' --gtest_output=xml:build-test/primary-address-before.xml > build-test/primary-address-before.log 2>&1
        result=$?
        set -e
        cat build-test/primary-address-before.log
        test "$result" -eq 1
        python3 -c 'import xml.etree.ElementTree as E; r=E.parse("build-test/primary-address-before.xml").getroot(); cases=r.findall(".//testcase"); assert len(cases)==3 and r.get("tests")=="3" and r.get("failures")=="3" and r.get("errors")=="0", E.tostring(r); assert all(c.find("failure") is not None and all("primary" in f.get("message", "") for f in c.findall("failure")) for c in cases); print("BASELINE: the same 3 primary-address cases failed on address-selection assertions without the production fix")'
        sha256sum test/mock_address_selection.cpp
      workingDirectory: dhcp6relay
      displayName: "Prove three address regressions fail without fix (temporary)"
  - script: |
      rm ../*.deb || true
      # Configure git identity for patch application
      git config --global user.email "build@sonic.net"
      git config --global user.name "SONiC Build"
      dpkg-buildpackage -us -uc -b -j$(nproc)
      cp ../*.deb $(Build.ArtifactStagingDirectory)
    workingDirectory: dhcp4relay
    displayName: "Compile sonic dhcp4relay"
  - publish: $(Build.ArtifactStagingDirectory)
    artifact: sonic-dhcp-relay.${{ parameters.arch }}
    displayName: "Archive dhcp-relay debian packages"
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: |
        dhcp6relay/build-test/dhcp6relay-test-test-result.xml
        dhcp4relay/build-test/dhcp4relay-test-test-result.xml
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
  - ${{ if and(eq(parameters.arch, 'amd64'), parameters.codeCoverage) }}:
    - task: PublishCodeCoverageResults@1
      inputs:
        summaryFileLocation: build-test/dhcp6relay-test-code-coverage.xml
        pathToSources: $(Build.SourcesDirectory)
        reportDirectory: $(Build.SourcesDirectory)/build-test
        codeCoverageTool: 'Cobertura'
      displayName: "Publish dhcp6relay code coverage"
    - task: PublishCodeCoverageResults@1
      inputs:
        summaryFileLocation: build-test/dhcp4relay-test-code-coverage.xml
        pathToSources: $(Build.SourcesDirectory)
        reportDirectory: $(Build.SourcesDirectory)/build-test
        codeCoverageTool: 'Cobertura'
      displayName: "Publish dhcp4relay code coverage"
